<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning 2026</title>
<link rel="manifest" href="2026.webmanifest">
<link rel="icon" type="image/png" href="2026.png">
<link rel="apple-touch-icon" href="2026.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planning 2026">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f4e79">
<style>
  html, body { margin: 0; height: 100%; background: #1f4e79; overflow: hidden; }
  iframe { position: fixed; left: 0; right: 0; bottom: 0; top: env(safe-area-inset-top, 0px);
           width: 100%; height: calc(100% - env(safe-area-inset-top, 0px)); border: 0; background: #fff; }
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycby5GD1KNTm4kZhMWiwLMmkZ5C_2c7-JcY6GsugVKK48FuH9QjP-ZFcDClwKT1ncIyRe/exec" title="Planning 2026"></iframe>
<script>
  // La page installée sur l'écran d'accueil garde le code d'accès et la dernière copie du planning
  // (l'iPad efface la mémoire de l'appli à chaque fermeture) et les transmet à l'appli.
  var dbP = null;
  function db() {
    if (!dbP) dbP = new Promise(function (ok, ko) {
      var r = indexedDB.open('planning', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onsuccess = function () { ok(r.result); };
      r.onerror = function () { ko(r.error); };
    });
    return dbP;
  }
  function lire(k) {
    return db().then(function (d) {
      return new Promise(function (ok) {
        var q = d.transaction('kv').objectStore('kv').get(k);
        q.onsuccess = function () { ok(q.result || null); };
        q.onerror = function () { ok(null); };
      });
    }).catch(function () { return null; });
  }
  function ecrire(k, v) {
    return db().then(function (d) {
      var s = d.transaction('kv', 'readwrite').objectStore('kv');
      if (v == null) s.delete(k); else s.put(v, k);
    }).catch(function () { });
  }
  window.addEventListener('message', function (e) {
    if (!/\.googleusercontent\.com$/.test(e.origin) || !e.data || !e.data.planning) return;
    var src = e.source, org = e.origin, m = e.data;
    try {
      if (m.planning === 'getCode') {
        lire('data').then(function (data) {
          var code = ''; try { code = localStorage.getItem('planning_code') || ''; } catch (err) { }
          src.postMessage({ planning: 'code', code: code, data: code ? data : null }, org);
        });
      } else if (m.planning === 'setCode') {
        if (m.code) localStorage.setItem('planning_code', m.code);
        else { localStorage.removeItem('planning_code'); ecrire('data', null); }
      } else if (m.planning === 'setData') {
        ecrire('data', m.data);
      }
    } catch (err) { }
  });
</script>
</body>
</html>
