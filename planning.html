<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning</title>
<link rel="manifest" href="planning.webmanifest">
<link rel="icon" type="image/png" href="planning.png">
<link rel="apple-touch-icon" href="planning.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planning">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f4e79">
<style>
  html, body { margin: 0; height: 100%; background: #1f4e79; overflow: hidden; }
  iframe { position: fixed; left: 0; right: 0; bottom: 0; top: env(safe-area-inset-top, 0px);
           width: 100%; height: calc(100% - env(safe-area-inset-top, 0px)); border: 0; background: #fff; }
</style>
</head>
<body>
<iframe id="appli" title="Planning"></iframe>
<script>
  // Une appli Apps Script par année ; à partir du 1er janvier d'une année, les années passées ne sont plus proposées.
  var APPLIS = {
    '2026': 'https://script.google.com/macros/s/AKfycby5GD1KNTm4kZhMWiwLMmkZ5C_2c7-JcY6GsugVKK48FuH9QjP-ZFcDClwKT1ncIyRe/exec',
    '2027': 'https://script.google.com/macros/s/AKfycbzMgLmT1KaF83uUOG2JIzIPB8EiJts4k0KdwmwjBfsx7ri2dp3H3D_4f_wq4UjXwXil/exec'
  };
  function annees() {
    var an = new Date().getFullYear(), l = Object.keys(APPLIS).sort().filter(function (a) { return +a >= an; });
    return l.length ? l : [Object.keys(APPLIS).sort().pop()];
  }
  function lireLS(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function ecrireLS(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } }
  var ANNEE = (function () {
    var l = annees(), m = lireLS('planning_annee'), an = String(new Date().getFullYear());
    return l.indexOf(m) >= 0 ? m : (l.indexOf(an) >= 0 ? an : l[0]);
  })();
  document.getElementById('appli').src = APPLIS[ANNEE];

  // Retour après un long moment en arrière-plan (Android) : on recharge l'appli pour repartir proprement
  var cachee = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { cachee = Date.now(); return; }
    if (cachee && Date.now() - cachee > 10 * 60 * 1000) document.getElementById('appli').src = APPLIS[ANNEE];
    cachee = 0;
  });

  // La page installée sur l'écran d'accueil garde le code d'accès et la dernière copie du planning de chaque année
  // (l'iPad efface la mémoire de l'appli à chaque fermeture) et les transmet à l'appli.
  var dbP = null;
  function db() {
    if (!dbP) dbP = new Promise(function (ok, ko) {
      var r = indexedDB.open('planning', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onsuccess = function () { ok(r.result); };
      r.onerror = function () { ko(r.error); };
    });
    return dbP;
  }
  function lire(k) {
    return db().then(function (d) {
      return new Promise(function (ok) {
        var q = d.transaction('kv').objectStore('kv').get(k);
        q.onsuccess = function () { ok(q.result || null); };
        q.onerror = function () { ok(null); };
      });
    }).catch(function () { return null; });
  }
  function ecrire(k, v) {
    return db().then(function (d) {
      var s = d.transaction('kv', 'readwrite').objectStore('kv');
      if (v == null) s.delete(k); else s.put(v, k);
    }).catch(function () { });
  }
  window.addEventListener('message', function (e) {
    if (!/\.googleusercontent\.com$/.test(e.origin) || !e.data || !e.data.planning) return;
    var src = e.source, org = e.origin, m = e.data;
    try {
      if (m.planning === 'getCode') {
        lire('data_' + ANNEE).then(function (data) {
          var code = lireLS('planning_code') || '';
          src.postMessage({ planning: 'code', code: code, data: code ? data : null, annees: annees(), annee: ANNEE }, org);
        });
      } else if (m.planning === 'setCode') {
        if (m.code) ecrireLS('planning_code', m.code);
        else { ecrireLS('planning_code', null); Object.keys(APPLIS).forEach(function (a) { ecrire('data_' + a, null); }); }
      } else if (m.planning === 'setData') {
        ecrire('data_' + ANNEE, m.data);
      } else if (m.planning === 'annee' && annees().indexOf(String(m.annee)) >= 0) {
        ANNEE = String(m.annee); ecrireLS('planning_annee', ANNEE);
        document.getElementById('appli').src = APPLIS[ANNEE];
      }
    } catch (err) { }
  });
</script>
</body>
</html>
